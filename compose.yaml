x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+psycopg://brasil:${POSTGRES_PASSWORD:?Execute scripts/setup-docker.ps1}@postgres:5432/brasil_portodos
  CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-3000}","http://127.0.0.1:${FRONTEND_PORT:-3000}"]'
  COOKIE_SECURE: "false"
  ENVIRONMENT: development

x-backend: &backend
  image: brasilportodos-backend:local
  build: ./backend
  env_file:
    - ./backend/.env
  environment: *backend-environment
  init: true

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: brasil_portodos
      POSTGRES_USER: brasil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute scripts/setup-docker.ps1}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brasil -d brasil_portodos"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import socket; socket.create_connection(('127.0.0.1',8000),timeout=4).close()"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 10
    restart: unless-stopped

  frontend:
    image: brasilportodos-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('node:net').createConnection({host:'127.0.0.1',port:3000});s.setTimeout(4000);s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));s.on('timeout',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 10
    restart: unless-stopped

  guidance-cleanup:
    <<: *backend
    command: ["/app/.venv/bin/python", "-u", "-m", "app.guidance_cleanup", "--watch"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
