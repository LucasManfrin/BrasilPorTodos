[project]
name = "brasil-por-todos-backend"
version = "0.1.0"
description = "API e motor fiscal do BrasilPorTodos"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.5,<3",
    "pyjwt>=2.15.1",
    "pwdlib[argon2]>=0.3.1",
    "email-validator>=2.3.0",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["database: requires PostgreSQL and RUN_DATABASE_TESTS=1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
